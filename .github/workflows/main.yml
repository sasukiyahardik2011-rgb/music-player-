name: Extract ZIP and Build APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Find ZIP and extract it
      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo "Please upload your Android project ZIP to the repository."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "ZIP extracted successfully."
          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200


      # 3. Detect Android/Gradle project
      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          # First preference: Gradle wrapper
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          # If gradlew was not found, search for settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find extracted -type f \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            | head -n 1)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            fi
          fi

          # Final fallback: build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(
