name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Detect Android Project
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find extracted -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android/Gradle project not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          # If gradlew was found inside the project root
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            # Search upward for the actual Gradle root
            ROOT_DIR=$(find extracted -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

            if [ -z "$ROOT_DIR" ]; then
              ROOT_DIR=$(find extracted -type f -name "gradlew" -printf '%h\n' | head -n 1)
            fi

            if [ -z "$ROOT_DIR" ]; then
              echo "ERROR: Gradle root project could not be detected."
              exit 1
            fi

            echo "PROJECT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Music-Player-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
